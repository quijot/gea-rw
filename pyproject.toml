[tool.poetry]
name = "gea"
version = "0.2.6"
description = "Gestión de Expedientes de Agrimensores"
authors = ["Santiago Pestarini <santiagonob@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/quijot/gea-package"
packages = [{ include = "gea" }]

[tool.poetry.dependencies]
python = "^3.14"
django-environ = "^0.11"
Django = "^5"
django-crispy-forms = "^1"
# crispy-bootstrap4 = "^2024"
django-dynamic-preferences = "^1"
django-extensions = "^3"
django-nested-admin = "^4"
django-redis = "^5"
django-select2 = "^8"
gunicorn = "^23"
psycopg2 = "^2"
whitenoise = "^6"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
ruff = "^0.9"
ipython = "^8"
pydot = "^2"
coverage = "^7"
graphifyy = "^0.7"

[tool.ruff]
line-length = 119
extend-exclude = ["gea/migrations/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
