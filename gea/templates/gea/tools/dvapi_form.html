{% extends "base.html" %}

{% block title %}GEA | Dígito Verificador{% endblock %}

{% block content %}
<form class="form-horizontal col-lg-6" method="post">{% csrf_token %}
  <legend><i class="bi bi-calculator-fill"></i> Calcular Dígito Verificador API</legend>
  <fieldset>
    <div class="mb-3">
      <table class="table table-condensed table-hover">
      {{ form.as_table }}
      </table>
      <div class="well well-sm col-lg-10">
        Resultado: <strong>{{ dv }}</strong>
      </div>
        <button type="submit" class="btn btn-primary float-end">Calcular</button>
    </div>
  </fieldset>
</form>
{% endblock %}
