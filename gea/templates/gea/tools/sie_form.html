{% extends "base.html" %}

{% block title %}GEA | Sistema de Información de Expedientes del SCIT{% endblock %}

{% block content %}
<form class="form-horizontal col-lg-6" method="post">{% csrf_token %}
  <legend><i class="bi bi-folder-fill"></i> Consultar estado de Expediente SCIT</legend>

{% endblock %}
