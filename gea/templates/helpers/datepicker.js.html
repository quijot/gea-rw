{% load static %}
<script src="{% static 'js/flatpickr.min.js' %}"></script>
<script src="{% static 'js/flatpickr.es.js' %}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    flatpickr('.date', {
      locale: 'es',
      dateFormat: 'd/m/Y',
      allowInput: true,
      todayHighlight: true,
    });
  });
</script>
