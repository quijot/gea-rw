{% load static %}

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}{% endblock %}</title>
    {% block stylesheets %}
    <style>
     body { max-width:100%; margin: 25mm 22.5mm 15mm; font-size: 11pt; font-family: Rubik, sans-serif; font-size: 10pt; }
     .header { display: flex; justify-content: center; }
     .header img { width: 170mm; position: fixed; top: 0; }
     .footer { font-size: 9pt; display: flex; justify-content: center; }
     .footer p { position: fixed; bottom: 12mm; }
     .footer img { width: 170mm; position: fixed; bottom: 0; right: 0; }
     p { text-align: justify }
     p.sangria { text-indent: 20% }
     a { color: black; text-decoration: none; border-bottom: 1px solid black }
     a:visited { text-decoration: none }
     a:hover { color: #4fb2d3 }
     table { border: no-border; border-collapse: collapse; width: 100% }
     th, td { border-bottom: 1px solid black }
    </style>
    {% endblock %}
  </head>
  <body>
    {% block header %}
    <div class="header">
      <img src="{% static 'img/nota-header.png' %}" alt="header">
    </div>
    {% endblock %}
    {% block content %}
        {{ content }}
    {% endblock %}
    {% block footer %}
    <div class="footer">
      <p>www.pestarini.com.ar /// estudio@pestarini.com.ar /// +54 341 618-0010</p>
      <img src="{% static 'img/nota-footer.png' %}" alt="header">
    </div>
    {% endblock %}
  </body>
</html>
